name: Test environment secret

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Check environment secret
        shell: bash
        env:
          TEST_TOKEN: ${{ secrets.ENV_ONLY_TEST_TOKEN }}
        run: |
          if [ -z "${TEST_TOKEN:-}" ]; then
            echo "::error::Environment secret is unavailable"
            exit 1
          fi

          echo "available"