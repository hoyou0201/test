name: Screenshot - Missing Secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest

    steps:
      - name: Check required secret
        shell: bash
        env:
          DEPLOY_TOKEN: ${{ secrets.SCREENSHOT_MISSING_SECRET_20260726 }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::DEPLOY_TOKEN is unavailable in this run"
            exit 1
          fi

          echo "DEPLOY_TOKEN is available"