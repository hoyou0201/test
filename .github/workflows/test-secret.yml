name: Test secret availability

on:
  workflow_dispatch:

jobs:
  check-secret:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check TEST_TOKEN on Bash
        if: runner.os == 'Linux'
        shell: bash
        env:
          TEST_TOKEN: ${{ secrets.TEST_TOKEN }}
        run: |
          if [ -z "${TEST_TOKEN:-}" ]; then
            echo "::error::TEST_TOKEN is unavailable"
            exit 1
          fi

          echo "available"

      - name: Check TEST_TOKEN on PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TEST_TOKEN: ${{ secrets.TEST_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TEST_TOKEN)) {
            Write-Error "TEST_TOKEN is unavailable"
            exit 1
          }

          Write-Host "available"