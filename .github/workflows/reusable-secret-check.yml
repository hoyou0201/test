name: Reusable secret check

on:
  workflow_call:
    secrets:
      test_token:
        required: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check mapped secret
        shell: bash
        env:
          TEST_TOKEN: ${{ secrets.test_token }}
        run: |
          if [ -z "${TEST_TOKEN:-}" ]; then
            echo "::error::TEST_TOKEN was not passed to the reusable workflow"
            exit 1
          fi

          echo "available"